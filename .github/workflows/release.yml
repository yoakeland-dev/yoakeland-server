# Cross-compiles the daemon and publishes one raw binary per platform as a GitHub prerelease, with a
# SHA256SUMS file the desktop app checks each download against.
# Push a tag (git tag v0.1.0 && git push --tags) to release. The desktop app downloads these by
# name (yoake-electron/electron/serverInstall.js: yoakeland_<os>_<arch>[.exe]), so keep the names.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Test and build with a read-only token; only the release job below can write to the repo.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Nothing is released from a tree whose tests fail, race detector on.
      - name: Test
        run: go vet ./... && go test -race ./...
      - name: Build
        run: |
          mkdir out
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*} arch=${t#*/}
            ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
              -o "out/yoakeland_${os}_${arch}${ext}" ./cmd/yoakeland
          done
          (cd out && sha256sum yoakeland_* > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yoakeland-binaries
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yoakeland-binaries
          path: out
      # Always a prerelease; the app reads the releases list because /releases/latest skips those.
      - run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes \
            --notes "Pre-release. Linux is the primary platform; the macOS and Windows builds are experimental."
        env:
          GH_TOKEN: ${{ github.token }}
